name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for pub.dev automated publishing (GitHub OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Sets up the OIDC token pub.dev uses to authenticate the upload.
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check tag matches pubspec version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Publish
        run: flutter pub publish --force
